<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuestãoCerta</title>
  <noscript><style>.carregando{display:none}</style></noscript>
  <meta name="color-scheme" content="light dark">
  <script src="../js/tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/x-icon" href="/favicon.svg">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="deslogado">

  <!-- ========== CABEÇALHO ========== -->
  <header class="topbar">
    <button class="menu-btn" id="btn-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer">
      <span data-icone="menu" data-tam="22"></span>
    </button>

    <a class="brand" href="#/" aria-label="QuestãoCerta — início">
      <span class="brand-mark" aria-hidden="true"><span data-icone="logo" data-tam="20"></span></span>
      <span class="brand-name">Questão<span>Certa</span></span>
    </a>

    <label class="search" for="busca">
      <span data-icone="busca" data-tam="18"></span>
      <input id="busca" type="search" placeholder="Buscar por matéria, título ou descrição..." autocomplete="off">
    </label>

    <button class="btn btn-primary btn-criar" id="btn-criar" type="button" aria-label="Criar questionário">
      <span data-icone="mais" data-tam="18"></span>
      <span class="btn-txt">Criar questionário</span>
    </button>

    <a class="avatar-btn" id="avatar-btn" href="#/perfil" aria-label="Abrir meu perfil"></a>
  </header>

  <!-- ========== TELAS (preenchido pelo roteador) ========== -->
  <main id="view" tabindex="-1"></main>

  <!-- Tela de carregamento (some quando o servidor responde) -->
  <div class="carregando" id="carregando" role="status"><div class="spinner"></div><span>Carregando…</span></div>

  <!-- ========== MENU LATERAL ========== -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Menu lateral" inert>
    <div class="drawer-head">
      <a class="brand" href="#/" aria-label="QuestãoCerta — início">
        <span class="brand-mark" aria-hidden="true"><span data-icone="logo" data-tam="20"></span></span>
        <span class="brand-name">Questão<span>Certa</span></span>
      </a>
      <button class="icon-btn plain" id="drawer-close" type="button" aria-label="Fechar menu">
        <span data-icone="x" data-tam="22"></span>
      </button>
    </div>

    <div class="drawer-scroll">
      <a class="user-card" href="#/perfil">
        <span id="user-avatar"></span>
        <div>
          <strong id="user-nome"></strong>
          <small id="user-curso"></small>
        </div>
      </a>

      <p class="drawer-title">Ações rápidas</p>
      <button class="nav-item quick destaque" type="button" data-acao="criar">
        <span class="nav-ico solid-indigo"><span data-icone="maisCirculo" data-tam="20"></span></span>
        Criar um Questionário
      </button>
      <button class="nav-item quick" type="button" data-acao="responder">
        <span class="nav-ico soft-green"><span data-icone="play" data-tam="20"></span></span>
        Responder Questionário
      </button>

      <p class="drawer-title">Menu principal</p>
      <a class="nav-item" href="#/" data-rota="/"><span data-icone="grade"></span>Início</a>
      <a class="nav-item" href="#/materias" data-rota="/materias"><span data-icone="livro"></span>Matérias</a>
      <a class="nav-item" href="#/estatisticas" data-rota="/estatisticas"><span data-icone="grafico"></span>Minhas Estatísticas</a>
      <a class="nav-item" href="#/salvos" data-rota="/salvos"><span data-icone="marcador"></span>Questionários Salvos</a>
      <a class="nav-item" href="#/perfil" data-rota="/perfil"><span data-icone="usuario"></span>Meu Perfil</a>
      <a class="nav-item" href="#/configuracoes" data-rota="/configuracoes"><span data-icone="engrenagem"></span>Configurações</a>
    </div>

    <div class="drawer-foot">
      <button class="logout" type="button" data-acao="sair">
        <span data-icone="sair" data-tam="18"></span>
        Sair da Conta
      </button>
    </div>
  </aside>

  <!-- ========== JANELA: CRIAR / EDITAR QUESTIONÁRIO ========== -->
  <dialog id="dlg-form" class="dlg" aria-labelledby="dlg-form-title">
    <form id="form-questionario" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-form-title">Novo questionário</h2>
        <button class="icon-btn" type="button" data-fechar aria-label="Fechar"><span data-icone="x" data-tam="20"></span></button>
      </header>

      <div class="dlg-body">
        <div class="form-grid">
          <div class="field span-2">
            <label for="f-titulo">Título</label>
            <input id="f-titulo" name="titulo" type="text" maxlength="80" placeholder="Ex.: Atos administrativos e licitações" required>
          </div>
          <div class="field">
            <label for="f-materia">Matéria</label>
            <input id="f-materia" name="materia" type="text" maxlength="40" list="lista-materias" placeholder="Escolha ou digite uma nova" required autocomplete="off">
            <datalist id="lista-materias"></datalist>
          </div>
          <div class="field">
            <label for="f-dificuldade">Dificuldade</label>
            <select id="f-dificuldade" name="dificuldade">
              <option>Fácil</option>
              <option selected>Médio</option>
              <option>Difícil</option>
            </select>
          </div>
          <div class="field span-2">
            <label for="f-descricao">Descrição <span class="opt">(opcional)</span></label>
            <input id="f-descricao" name="descricao" type="text" maxlength="140" placeholder="Em uma frase, do que trata este questionário?">
          </div>
          <div class="field">
            <label for="f-tempo">Tempo em minutos <span class="opt">(opcional)</span></label>
            <input id="f-tempo" name="tempo" type="number" min="1" max="600" placeholder="Calculado se ficar em branco">
          </div>
        </div>

        <div class="questions-head">
          <h3>Questões</h3>
          <span id="q-count" class="muted">0 questões</span>
        </div>
        <div id="questions"></div>

        <button class="btn btn-ghost btn-block" id="btn-add-questao" type="button">
          <span data-icone="mais" data-tam="18"></span>
          Adicionar questão
        </button>
      </div>

      <footer class="dlg-foot">
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="btn btn-ghost" type="button" data-fechar>Cancelar</button>
        <button class="btn btn-primary" type="submit" id="btn-salvar">Salvar questionário</button>
      </footer>
    </form>
  </dialog>

  <!-- ========== JANELA: VISUALIZAR QUESTÕES ========== -->
  <dialog id="dlg-ver" class="dlg" aria-labelledby="ver-titulo">
    <header class="dlg-head">
      <div>
        <h2 id="ver-titulo"></h2>
        <p class="muted" id="ver-meta"></p>
      </div>
      <button class="icon-btn" type="button" data-fechar aria-label="Fechar"><span data-icone="x" data-tam="20"></span></button>
    </header>
    <div class="dlg-body" id="ver-corpo"></div>
  </dialog>

  <!-- ========== JANELA: CRIAR / EDITAR MATÉRIA ========== -->
  <dialog id="dlg-materia" class="dlg dlg-sm" aria-labelledby="dlg-materia-titulo">
    <form id="form-materia" novalidate>
      <header class="dlg-head">
        <h2 id="dlg-materia-titulo">Nova matéria</h2>
        <button class="icon-btn" type="button" data-fechar aria-label="Fechar"><span data-icone="x" data-tam="20"></span></button>
      </header>
      <div class="dlg-body">
        <div class="form-grid one">
          <div class="field">
            <label for="f-mat-nome">Nome</label>
            <input id="f-mat-nome" type="text" maxlength="40" placeholder="Ex.: Língua Portuguesa" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-mat-desc">Descrição <span class="opt">(opcional)</span></label>
            <input id="f-mat-desc" type="text" maxlength="140" placeholder="Do que trata esta matéria?">
          </div>
          <div class="field">
            <span class="label-like" id="rotulo-cores">Cor</span>
            <div class="swatches" id="f-mat-cores" role="radiogroup" aria-labelledby="rotulo-cores"></div>
          </div>
        </div>
      </div>
      <footer class="dlg-foot">
        <p class="form-error" id="form-materia-error" role="alert" hidden></p>
        <button class="btn btn-ghost" type="button" data-fechar>Cancelar</button>
        <button class="btn btn-primary" type="submit" id="btn-salvar-materia">Criar matéria</button>
      </footer>
    </form>
  </dialog>

  <!-- ========== JANELA: ESCOLHER QUESTIONÁRIO ========== -->
  <dialog id="dlg-escolher" class="dlg dlg-sm" aria-labelledby="escolher-titulo">
    <header class="dlg-head">
      <div>
        <h2 id="escolher-titulo">Responder questionário</h2>
        <p class="muted">Escolha qual você quer responder agora.</p>
      </div>
      <button class="icon-btn" type="button" data-fechar aria-label="Fechar"><span data-icone="x" data-tam="20"></span></button>
    </header>
    <div class="dlg-body" id="escolher-lista"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Ordem importa: configuração → biblioteca → base → telas → início -->
  <script src="../js/config.js"></script>
  <script src="../js/vendor/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/componentes.js"></script>
  <script src="../js/modais.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/paginas/auth.js"></script>
  <script src="../js/paginas/inicio.js"></script>
  <script src="../js/paginas/materias.js"></script>
  <script src="../js/paginas/estatisticas.js"></script>
  <script src="../js/paginas/salvos.js"></script>
  <script src="../js/paginas/perfil.js"></script>
  <script src="../js/paginas/configuracoes.js"></script>
  <script src="../js/paginas/responder.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
